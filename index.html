<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C0C0B;--surface:#141413;--surface2:#1A1A18;--border:#252523;--border2:#333330;
  --text:#EEECEA;--text2:#8A8A86;--text3:#4A4A47;
  --accent:#4F7AFF;--accent-dim:rgba(79,122,255,0.08);--accent-glow:rgba(79,122,255,0.15);
  --green:#4ADE80;--green-bg:rgba(74,222,128,0.08);
  --amber:#FBB040;--amber-bg:rgba(251,176,64,0.08);
  --red:#F87171;--red-bg:rgba(248,113,113,0.08);
  --blue-pill:rgba(79,122,255,0.12);
}
html,body{height:100%;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* APP SHELL */
.app{display:flex;flex-direction:column;min-height:100vh}
.body{display:flex;flex:1;overflow:hidden;min-height:0}
.main{flex:1;overflow-y:auto;padding:40px 48px;background:var(--bg);min-height:0}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 48px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.wordmark{font-size:11px;font-weight:600;letter-spacing:0.24em;text-transform:uppercase;color:var(--text)}
.tagline{font-size:11px;color:var(--text3);letter-spacing:0.02em}
.hdr-l{display:flex;align-items:center;gap:20px}
.hdr-div{width:1px;height:13px;background:var(--border2)}
.nav{display:flex}
.nb{padding:6px 14px;font-size:12px;border:none;background:transparent;color:var(--text3);letter-spacing:0.02em;transition:color 0.1s;font-weight:400}
.nb:hover{color:var(--text2)}
.nb.active{color:var(--text);font-weight:500}

/* RAIL */
.rail{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.rs{padding:20px 16px;border-bottom:1px solid var(--border)}
.rl{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.cb{width:100%;text-align:left;background:transparent;border:none;border-left:2px solid transparent;padding:9px 12px;margin-bottom:2px;transition:all 0.1s}
.cb:hover{background:var(--surface2)}
.cb.active{border-left-color:var(--accent);background:var(--accent-dim)}
.cn{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px}
.ct{font-size:11px;color:var(--text3);margin-bottom:6px}
.cf{display:flex;justify-content:space-between;align-items:center}
.cs{font-size:11px;font-weight:500;color:var(--text2)}

/* PILLS */
.pill{font-size:10px;font-weight:600;padding:2px 8px;letter-spacing:0.04em;text-transform:uppercase}
.pg{background:var(--green-bg);color:var(--green)}
.pa{background:var(--amber-bg);color:var(--amber)}
.pr{background:var(--red-bg);color:var(--red)}
.pb{background:var(--blue-pill);color:var(--accent)}

/* SHARED CARD PRIMITIVES */
.card{background:var(--surface);border:1px solid var(--border)}
.card2{background:var(--surface2);border:1px solid var(--border)}
.sec-label{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.divider{height:1px;background:var(--border);margin:0}

/* ─── ANALYSIS VIEW ─── */
.av-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
.av-title{font-size:26px;font-weight:300;letter-spacing:-0.02em;color:var(--text);margin-bottom:4px}
.av-sub{font-size:12px;color:var(--text3)}
.av-actions{display:flex;gap:8px;padding-top:4px}
.btn{padding:7px 16px;font-size:12px;border:1px solid var(--border2);background:transparent;color:var(--text2);transition:all 0.1s;font-weight:400}
.btn:hover{background:var(--surface2);color:var(--text)}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#3d68e8}

/* VERDICT HERO */
.vh{display:flex;justify-content:space-between;align-items:stretch;background:var(--surface);border:1px solid var(--border);margin-bottom:1px}
.vh-l{flex:1;padding:28px 32px;border-right:1px solid var(--border)}
.vh-lbl{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.vh-v{font-size:22px;font-weight:300;color:var(--text);letter-spacing:-0.01em;margin-bottom:10px}
.vh-a{font-size:13px;color:var(--text2);line-height:1.7;max-width:540px}
.vh-r{padding:28px 32px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;min-width:160px}
.vh-score{font-size:56px;font-weight:300;color:var(--text);line-height:1}
.vh-slbl{font-size:11px;color:var(--text3);margin-top:4px;text-align:right}

/* SIGNAL STRIP */
.ss{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--border);border-top:none;margin-bottom:1px}
.si{padding:16px 20px}
.si+.si{border-left:1px solid var(--border)}
.si-lbl{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.si-val{font-size:24px;font-weight:300;color:var(--text);margin-bottom:4px}
.si-val span{font-size:12px;color:var(--text3);margin-left:2px}
.si-trend{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:4px}
.si-src{font-size:10px;color:var(--text3)}

/* DATA NOTE */
.dn{font-size:11px;color:var(--text3);padding:8px 20px;background:var(--surface2);border:1px solid var(--border);border-top:none;line-height:1.5;margin-bottom:1px}

/* CHARTS */
.ch-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:1px}
.ch-card{background:var(--surface);padding:24px;min-width:0}
.ch-lbl{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:18px}
.rw{position:relative;height:200px;width:100%}
.hw{position:relative;height:200px;width:100%}

/* SCORING */
.sc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:1px}
.sc-card{background:var(--surface);padding:20px 24px}
.sc-cat{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.sc-line{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.sc-line:last-of-type{border-bottom:none;padding-bottom:0;margin-bottom:8px}
.sc-name{font-size:12px;color:var(--text2)}
.sc-val{font-size:14px;font-weight:500;color:var(--text)}
.sc-basis{font-size:11px;color:var(--text3);line-height:1.6}

/* ASSESSMENT */
.as-card{background:var(--surface);border:1px solid var(--border);padding:24px 32px;margin-bottom:1px}
.as-lbl{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.as-text{font-size:13px;line-height:1.85;color:var(--text2)}

/* REFS */
.rf-card{background:var(--surface);border:1px solid var(--border);padding:18px 24px}
.rf-lbl{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.rf-list{display:flex;flex-wrap:wrap;gap:5px}
.rf-tag{font-size:11px;padding:3px 9px;border:1px solid var(--border2);background:var(--surface2)}
.rf-tag a{color:var(--text2)}
.rf-tag a:hover{color:var(--accent)}

/* ─── PORTFOLIO VIEW ─── */
.pv-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
.pv-title{font-size:26px;font-weight:300;letter-spacing:-0.02em;margin-bottom:4px}
.pv-sub{font-size:12px;color:var(--text3)}
.sum-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:24px}
.sum-c{background:var(--surface);padding:16px;cursor:pointer;transition:background 0.1s}
.sum-c:hover{background:var(--surface2)}
.sum-c.active{background:var(--accent-dim)}
.sum-n{font-size:11px;color:var(--text3);margin-bottom:6px}
.sum-s{font-size:28px;font-weight:300;color:var(--text);margin-bottom:8px;line-height:1}
.conc{cursor:default!important}
.cg{background:var(--green-bg)!important}
.ca{background:var(--amber-bg)!important}
.cr{background:var(--red-bg)!important}
.cd{font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5}
.mx-card{background:var(--surface);border:1px solid var(--border);padding:28px}
.mx-wrap{height:300px;margin-top:8px;width:100%}
.lgd{display:flex;gap:20px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
.li{display:flex;align-items:center;gap:8px}
.ld{width:7px;height:7px;background:var(--border2)}
.ld.active{background:var(--accent)}
.ln{font-size:12px;color:var(--text2)}

/* ─── DEPLOYMENT VIEW ─── */
.dv-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px}
.dv-title{font-size:26px;font-weight:300;letter-spacing:-0.02em;color:var(--text);margin-bottom:4px}
.dv-sub{font-size:12px;color:var(--text3)}
.dv-tr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

/* VERDICT STRIP */
.dvs{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:32px}
.dvs-c{background:var(--surface);padding:20px 24px}
.dvs-lbl{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.dvs-val{font-size:14px;font-weight:400;color:var(--text);line-height:1.5}
.dvs-risk{color:var(--amber)}
.dvs-opp{color:var(--green)}

/* TIMELINE */
.tl-wrap{margin-bottom:32px}
.tl-spine{display:flex;align-items:stretch;gap:0;margin-bottom:0;position:relative}
.tl-phase{flex:1;position:relative}
.tl-node{padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-right:none;cursor:pointer;transition:all 0.15s;position:relative}
.tl-phase:last-child .tl-node{border-right:1px solid var(--border)}
.tl-node:hover{background:var(--surface2)}
.tl-node.selected{background:var(--accent-dim);border-color:var(--accent)}
.tl-phase:last-child .tl-node.selected{border-color:var(--accent)}
.tl-status{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px}
.tl-plabel{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.tl-ptitle{font-size:14px;font-weight:400;color:var(--text);margin-bottom:6px}
.tl-window{font-size:11px;color:var(--text3)}
.tl-capex{font-size:22px;font-weight:300;color:var(--text);margin-top:12px;line-height:1}
.tl-capex-lbl{font-size:10px;color:var(--text3);margin-top:3px}
.tl-connector{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:24px;height:24px;background:var(--border2);clip-path:polygon(0 0,60% 50%,0 100%);z-index:10}
.tl-node.selected .tl-connector{background:var(--accent)}

/* PHASE DETAIL */
.pd{background:var(--surface);border:1px solid var(--border);border-top:none;padding:28px 32px;animation:fadeIn 0.15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.pd-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:24px}
.pd-col-lbl{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.pd-text{font-size:12px;color:var(--text2);line-height:1.7}
.pd-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pd-tag{font-size:11px;color:var(--text2);padding:3px 9px;border:1px solid var(--border2);background:var(--surface2)}
.pd-row{padding-top:20px;border-top:1px solid var(--border);margin-top:4px}
.pd-row+.pd-row{margin-top:0}
.pd-gate{font-size:13px;color:var(--accent);line-height:1.65;font-weight:400}
.pd-risk{font-size:13px;color:var(--amber);line-height:1.65;font-weight:400}
.pd-note{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}

/* DRAWER */
.drw{position:fixed;right:0;top:0;bottom:0;width:420px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:200;animation:sIn 0.16s ease}
@keyframes sIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drw-hdr{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border)}
.drw-ttl{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3)}
.drw-x{background:none;border:none;font-size:14px;color:var(--text3);padding:4px 8px}
.drw-x:hover{color:var(--text)}
.drw-body{flex:1;overflow-y:auto;padding:24px 28px}
.drw-text{font-size:13px;line-height:1.9;color:var(--text)}
.drw-note{font-size:11px;color:var(--text3);margin-top:18px;padding-top:16px;border-top:1px solid var(--border);line-height:1.6}
.loading{display:flex;gap:5px;align-items:center;padding:20px 0}
.dot{width:5px;height:5px;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,80%,100%{opacity:0.2}40%{opacity:1}}

.hidden{display:none!important}

/* MOBILE */
@media(max-width:768px){
  .hdr{padding:0 20px}.tagline{display:none}
  .body{flex-direction:column;height:auto;overflow:visible;min-height:unset}
  .rail{width:100%;border-right:none;border-bottom:1px solid var(--border)}
  .main{padding:20px;overflow-y:visible;height:auto}
  .vh{flex-direction:column}.vh-r{align-items:flex-start;padding-top:0}
  .ch-row,.sc-row,.dvs{grid-template-columns:1fr}
  .ss{grid-template-columns:1fr}
  .si+.si{border-left:none;border-top:1px solid var(--border)}
  .sum-grid{grid-template-columns:repeat(3,1fr)}
  .sum-c:last-child{grid-column:span 3}
  .pv-top,.av-top,.dv-top{flex-direction:column;gap:12px}
  .tl-spine{flex-direction:column}
  .tl-phase{flex:none}
  .tl-node{border-right:1px solid var(--border);border-bottom:none}
  .tl-phase:last-child .tl-node{border-bottom:1px solid var(--border)}
  .tl-connector{display:none}
  .pd-grid{grid-template-columns:1fr}
  .rw,.hw{height:160px}
  .mx-wrap{height:220px}
  canvas{max-width:100%!important}
  .drw{width:100%;top:auto;height:75vh;border-left:none;border-top:1px solid var(--border);animation:sUp 0.16s ease}
  @keyframes sUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-l">
      <span class="wordmark">Meridian</span>
      <span class="hdr-div"></span>
      <span class="tagline">Cultural intelligence for long-horizon content decisions</span>
    </div>
    <nav class="nav">
      <button class="nb active" onclick="showView('analysis')">IP Analysis</button>
      <button class="nb" onclick="showView('portfolio')">Portfolio</button>
      <button class="nb" onclick="showView('deployment')">Deployment</button>
    </nav>
  </header>
  <div class="body">
    <aside class="rail">
      <div class="rs">
        <div class="rl">IP Candidates</div>
        <div id="clist"></div>
      </div>
    </aside>
    <main class="main">
      <div id="va"></div>
      <div id="vp" class="hidden"></div>
      <div id="vd" class="hidden"></div>
    </main>
  </div>
</div>

<div id="drw" class="drw hidden">
  <div class="drw-hdr">
    <span class="drw-ttl">Meridian Intelligence</span>
    <button class="drw-x" onclick="closeDrw()">✕</button>
  </div>
  <div class="drw-body" id="drw-body"></div>
</div>

<script>

  {l:'HBR WeChat (2019) — Reprint H058S7',u:'https://hbr.org/2019/10/the-kind-of-creative-thinking-that-fueled-wechats-success'},
  {l:'HBS Case 9-521-066 — Tencent',u:'https://www.hbs.edu/faculty/Pages/item.aspx?num=59136'},

function gs(c){return c.scores;}
function ov(c){const s=gs(c);return Math.round((s.cultural.score*0.4+s.strategic.score*0.35+s.commercial.score*0.25)*10);}
function vd(o){return o>=75?{l:'Greenlight',cls:'pg'}:o>=58?{l:'Develop further',cls:'pa'}:{l:'Defer',cls:'pr'};}
function cr(){const g=CANDIDATES.filter(c=>ov(c)>=75).length;return g>=4?{l:'Overextended',cls:'cr',d:'Too many greenlights competing for finite resources.'}:g>=3?{l:'Moderate spread',cls:'ca',d:'Three active greenlights creates resource tension.'}:{l:'Focused',cls:'cg',d:'Portfolio concentration is appropriate for current resource levels.'};}

function rCands(){
  document.getElementById('clist').innerHTML=CANDIDATES.map(c=>{
    const o=ov(c);const v=vd(o);
    return`<button class="cb${c.id===sid?' active':''}" onclick="sel('${c.id}')">
      <div class="cn">${c.name}</div><div class="ct">${c.sub}</div>
      <div class="cf"><span class="pill ${v.cls}">${v.l}</span><span class="cs">${o}</span></div>
    </button>`;
  }).join('');
}

function sel(id){sid=id;rCands();if(cv==='analysis')rAnalysis();else if(cv==='portfolio'){uMatrix();rLegend();}else rDeploy();}

function showView(v){
  cv=v;
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('active',(i===0&&v==='analysis')||(i===1&&v==='portfolio')||(i===2&&v==='deployment')));
  document.getElementById('va').classList.toggle('hidden',v!=='analysis');
  document.getElementById('vp').classList.toggle('hidden',v!=='portfolio');
  document.getElementById('vd').classList.toggle('hidden',v!=='deployment');
  if(v==='analysis')rAnalysis();else if(v==='portfolio')rPortfolio();else rDeploy();
}

}

  const c=CANDIDATES.find(x=>x.id===sid);

function selPhaseN(i){

/* ── AI ── */

function getKey(){
  return atob('c2stYW50LWFwaTAzLTRwLWNlLVpQWU1oYmZheTRoc25QT2hFa1NvdXBkZ3djNEpja2ltWHJ3NUEzdXJOX0FEdm1jN3lfT0pINUY2Z0lyWlhYZHFZbm9FclRRX1FoejRGckVnLVBvRUF4QUFB');
}

function openDrw(){document.getElementById('drw').classList.remove('hidden');}
function closeDrw(){document.getElementById('drw').classList.add('hidden');}
const SYS=`You are a senior strategy analyst advising Tencent's content leadership. Apply directly: NCC framework, transmedia storytelling (Jenkins, 2006), resource-based view (Barney, 1991), cultural discount theory (Hoskins and Mirus, 1988), soft power theory (Nye, 2004), platform economics (Parker, Van Alstyne and Choudary, 2016), Korean Wave precedent (Jin, 2016). Write in plain prose. No bullet points. No headers. No em dashes. No semicolons. Four to five sentences. Lead with the most important point. Cite frameworks by author and year. Be precise and actionable.`;

async function callAI(prompt){
  openDrw();
  document.getElementById('drw-body').innerHTML='<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYS,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    const text=d.content?.find(b=>b.type==='text')?.text||'No response received.';
    document.getElementById('drw-body').innerHTML=`<p class="drw-text">${text}</p><p class="drw-note">Analysis generated by Meridian intelligence layer. Framework citations link to sources in the references panel.</p>`;
  }catch(e){document.getElementById('drw-body').innerHTML='<p class="drw-text" style="color:var(--red)">Analysis unavailable. Check API configuration in Vercel environment variables.</p>';}
}

function runAI(){
  const c=CANDIDATES.find(x=>x.id===sid);const o=ov(c);
  callAI(`Analyse this IP for Tencent NCC portfolio decision. IP: ${c.name}. ${c.sub}. Portfolio score: ${o}/100. Recommendation: ${c.verdict}. Proposed action: ${c.action}. Primary risk: ${c.risk}. Primary opportunity: ${c.opportunity}. Cultural score: ${c.scores.cultural.score}/10. Strategic score: ${c.scores.strategic.score}/10. Commercial score: ${c.scores.commercial.score}/10. Domestic signal: ${c.signal.weibo.val}/100. International signal: ${c.signal.google.val}/100. Prior adaptations: ${c.signal.adaptations.val}. Provide a critical assessment. Challenge any assumptions and identify what would change your view.`);
}

function runSignal(){
  const c=CANDIDATES.find(x=>x.id===sid);
  callAI(`Assess the forward cultural resonance trajectory for ${c.name}. Production lead time for a streaming series is 18 to 24 months minimum, meaning a decision made today targets a market window no earlier than late 2026. Domestic Weibo signal: ${c.signal.weibo.val}/100. International Google Trends signal: ${c.signal.google.val}/100. Signal trend: ${c.signal.google.trend}. Prior adaptations: ${c.signal.adaptations.val}. Given content production lead times, what market conditions should Tencent be positioning for in 2027, and what specific steps should begin now to reach that position?`);
}

function runPortAI(){
  const summary=CANDIDATES.map(c=>`${c.name}: score ${ov(c)}/100, recommendation ${c.verdict}, cultural ${c.scores.cultural.score}/10, strategic ${c.scores.strategic.score}/10, commercial ${c.scores.commercial.score}/10`).join('. ');
  callAI(`Tencent NCC portfolio analysis. Current state: ${summary}. Concentration: ${cr().l}. Given finite content production resources, which two IP candidates should receive primary investment and why? What single prioritisation principle should govern NCC resource allocation decisions going forward? What is the most significant risk the portfolio currently underweights?`);
}

function runDepAI(){
  const c=CANDIDATES.find(x=>x.id===sid);
  const phases=c.phases.map(p=>`${p.label} (${p.window}): ${p.title}. Capex: ${p.capex}. Gate conditions: ${p.gate}`).join(' | ');
  callAI(`Review the strategic deployment plan for ${c.name} at Tencent. Recommendation: ${c.verdict}. Deployment phases: ${phases}. Primary risk: ${c.risk}. Primary opportunity: ${c.opportunity}. Assess whether the sequencing is correct, whether the capital allocation is appropriately sized given production benchmarks in the case, and identify the single most important condition that must be true for this plan to succeed. What would cause you to recommend abandoning this plan entirely?`);
}
